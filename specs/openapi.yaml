openapi: 3.1.0
info:
  title: Azure Meeting Minutes API
  version: 0.1.0
  description: |
    録音済み音声ファイルから、話者分離付き文字起こしと議事録を生成するAPI。
    長時間処理は非同期ジョブとして扱う。
servers:
  - url: https://{host}
    variables:
      host:
        default: localhost:7071
security:
  - bearerAuth: []
paths:
  /api/jobs:
    post:
      operationId: createJob
      summary: ジョブ作成とアップロードURL発行
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
        '400':
          $ref: '#/components/responses/Error'
    get:
      operationId: listJobs
      summary: ジョブ一覧
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobStatus'
  /api/jobs/{jobId}:
    get:
      operationId: getJob
      summary: ジョブ状態取得
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          $ref: '#/components/responses/Error'
  /api/jobs/{jobId}/upload-complete:
    post:
      operationId: completeUpload
      summary: アップロード完了通知とworkflow開始
      parameters:
        - $ref: '#/components/parameters/jobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCompleteRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCompleteResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/jobs/{jobId}/transcript:
    get:
      operationId: getTranscript
      summary: 正規化済みtranscript取得
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './normalized-transcript.schema.json'
        '404':
          $ref: '#/components/responses/Error'
  /api/jobs/{jobId}/minutes:
    get:
      operationId: getMinutes
      summary: 議事録取得
      parameters:
        - $ref: '#/components/parameters/jobId'
        - name: format
          in: query
          schema:
            type: string
            enum: [json, markdown]
            default: json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './minutes.schema.json'
            text/markdown:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
  /api/jobs/{jobId}/speaker-mapping:
    put:
      operationId: updateSpeakerMapping
      summary: speaker ID と表示名の紐付け更新
      parameters:
        - $ref: '#/components/parameters/jobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpeakerMappingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSpeakerMappingResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/jobs/{jobId}/minutes:regenerate:
    post:
      operationId: regenerateMinutes
      summary: 議事録再生成
      parameters:
        - $ref: '#/components/parameters/jobId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateMinutesRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status]
                properties:
                  jobId:
                    type: string
                  status:
                    $ref: '#/components/schemas/JobStatusEnum'
        '404':
          $ref: '#/components/responses/Error'
  /api/jobs/{jobId}:retry:
    post:
      operationId: retryJob
      summary: 失敗ジョブの再実行
      parameters:
        - $ref: '#/components/parameters/jobId'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status]
                properties:
                  jobId:
                    type: string
                  status:
                    $ref: '#/components/schemas/JobStatusEnum'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [fileName, contentType, fileSizeBytes]
      properties:
        fileName:
          type: string
        contentType:
          type: string
        fileSizeBytes:
          type: integer
          minimum: 1
        clientEstimatedDurationSeconds:
          type: integer
          minimum: 0
        meetingTitle:
          type: string
        locale:
          type: string
          default: ja-JP
        maxSpeakers:
          type: integer
          minimum: 2
          maximum: 30
          default: 8
    CreateJobResponse:
      type: object
      additionalProperties: false
      required: [jobId, status, blobName, uploadUrl, uploadExpiresAt, constraints]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [CREATED]
        blobName:
          type: string
        uploadUrl:
          type: string
        uploadExpiresAt:
          type: string
          format: date-time
        constraints:
          $ref: '#/components/schemas/InputConstraints'
    InputConstraints:
      type: object
      additionalProperties: false
      required: [normalMaxFileSizeBytes, hardMaxFileSizeBytes, maxDurationSecondsWithDiarization]
      properties:
        normalMaxFileSizeBytes:
          type: integer
          default: 314572800
        hardMaxFileSizeBytes:
          type: integer
          default: 524288000
        maxDurationSecondsWithDiarization:
          type: integer
          default: 7200
    UploadCompleteRequest:
      type: object
      additionalProperties: false
      properties:
        uploadedSizeBytes:
          type: integer
          minimum: 1
        clientSha256:
          type: string
    UploadCompleteResponse:
      type: object
      additionalProperties: false
      required: [jobId, status, orchestrationInstanceId, statusUrl]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [UPLOADED]
        orchestrationInstanceId:
          type: string
        statusUrl:
          type: string
    JobStatus:
      $ref: './job-status.schema.json'
    JobStatusEnum:
      type: string
      description: Must match specs/job-status.schema.json properties.status.enum.
      enum:
        - CREATED
        - UPLOADING
        - UPLOADED
        - VALIDATING
        - PREPROCESSING
        - TRANSCRIBING
        - TRANSCRIPT_READY
        - GENERATING_CHUNK_SUMMARIES
        - GENERATING_FINAL_MINUTES
        - REVIEW_REQUIRED
        - DONE
        - FAILED
        - CANCELLED
    UpdateSpeakerMappingRequest:
      type: object
      additionalProperties: false
      required: [speakers]
      properties:
        speakers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [speakerLabel, displayName]
            properties:
              speakerLabel:
                type: string
              displayName:
                type: string
    UpdateSpeakerMappingResponse:
      type: object
      additionalProperties: false
      required: [jobId, speakerMappingVersion, updatedAt]
      properties:
        jobId:
          type: string
        speakerMappingVersion:
          type: integer
        updatedAt:
          type: string
          format: date-time
    RegenerateMinutesRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
        preserveHumanEdits:
          type: boolean
          default: true
    ErrorObject:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        correlationId:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
