[project]
name = "meeting-minutes-backend"
version = "0.1.0"
description = "Backend API and Durable Functions for Azure meeting minutes generation."
readme = "../README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "azure-cosmos>=4.16.0",
    "azure-functions-durable>=1.5.0",
    "azure-functions>=1.24.0,<2.0.0",
    "azure-identity>=1.25.0",
    "azure-storage-blob>=12.29.0",
    "httpx>=0.28.0",
    "imageio-ffmpeg>=0.6.0",
    "jsonschema>=4.26.0",
    "openai>=2.38.0",
    "pydantic>=2.13.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S"]
ignore = ["UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
