name: 機能要望
description: Minutes Studio の改善案を提案します
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。実データ、SAS URL、トークン、実在する Azure ID / リソース名は書かないでください。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: ユーザーや運用上の課題を書いてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 期待する機能や動作を書いてください。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 関連領域
      options:
        - Frontend
        - Backend API
        - Durable workflow
        - Speech transcription
        - Minutes generation
        - Security / Auth
        - Infrastructure
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討済みの代替案があれば書いてください。
  - type: textarea
    id: privacy
    attributes:
      label: セキュリティ・プライバシー考慮
      description: 音声、transcript、議事録、認証、SAS、RBAC への影響があれば書いてください。
  - type: checkboxes
    id: safety
    attributes:
      label: 公開安全性チェック
      options:
        - label: この Issue に秘密情報、実データ、実在する Azure ID / リソース名を含めていません。
          required: true
