name: バグ報告
description: Minutes Studio の不具合を報告します
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。音声本文、transcript 全文、議事録全文、SAS URL、トークン、API key、実在する Azure ID / リソース名は書かないでください。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きましたか。
      placeholder: "例: upload-complete 後にジョブが FAILED になる"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 公開可能な最小手順を書いてください。
      placeholder: |
        1. <操作>
        2. <期待しない結果>
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影響範囲
      options:
        - Frontend
        - Backend API
        - Durable workflow
        - Speech transcription
        - Minutes generation
        - Infrastructure
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 実リソース名は placeholder にしてください。
      placeholder: |
        OS: <os>
        Python: 3.13.x
        Node: 20.x
        Azure region: <azure-region>
  - type: checkboxes
    id: safety
    attributes:
      label: 公開安全性チェック
      options:
        - label: この Issue に秘密情報、実データ、実在する Azure ID / リソース名を含めていません。
          required: true
